*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;

.cap{font-size:20px;color:#7f8cb4;margin-top:14px;text-align:center;line-height:1.5}

.spacer{flex:1;min-height:8px}
ul{list-style:none}
